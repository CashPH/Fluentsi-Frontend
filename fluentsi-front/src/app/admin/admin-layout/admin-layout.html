<div class="admin-theme">
    <aside class="admin-sidebar">
        <div class="sidebar-brand">
            <h2>FLUENTSI <span>Admin</span></h2>
        </div>
        
        <nav class="sidebar-nav">
            <!-- AQUÍ ESTÁ LA MAGIA DEL *ngIf -->
            <a *ngIf="permisos?.inicio" routerLink="/admin/dashboard" routerLinkActive="active">Inicio</a>
            <a *ngIf="permisos?.instructores" routerLink="/admin/instructores" routerLinkActive="active">Instructores</a>
            <a *ngIf="permisos?.asignaciones" routerLink="/admin/asignaciones" routerLinkActive="active">Asignaciones</a>
            <a *ngIf="permisos?.agenda" routerLink="/admin/sesiones" routerLinkActive="active">Agenda de Clases</a>
            <a *ngIf="permisos?.administradores" routerLink="/admin/administradores" routerLinkActive="active">Administradores</a>
            <a *ngIf="permisos?.prospectos" routerLink="/admin/prospectos" routerLinkActive="active">Prospectos</a>
        </nav>

        <!-- BOTÓN DE CERRAR SESIÓN -->
        <div style="margin-top: auto; padding: 20px;">
            <button (click)="cerrarSesion()" style="width: 100%; padding: 10px; background: #e53e3e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px;">
                Cerrar Sesión 🚪
            </button>
        </div>
    </aside>

    <div class="admin-main-content">
        <header class="admin-topbar">
            <!-- AQUÍ PODEMOS MOSTRAR EL NOMBRE DEL GÜEY QUE ENTRÓ -->
            <span class="admin-welcome">Panel de Control | Hola, {{ nombreAdmin }}</span>
        </header>

        <main class="admin-view-container">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>

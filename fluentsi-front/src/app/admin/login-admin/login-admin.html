<div class="login-wrapper">
    <div class="login-card">

        <div class="login-header">
            <h1>FLUENTSI <span>Admin</span></h1>
            <p>Ingresa tus credenciales para acceder al panel</p>
        </div>

        <!-- Mensaje de Error Dinámico -->
        <div class="alert-error" *ngIf="mensajeError">
            ⚠️ {{ mensajeError }}
        </div>

        <form (ngSubmit)="iniciarSesion()" class="login-form">
            <div class="form-group">
                <label>Usuario (Correo)</label>
                <input type="email" class="form-control" name="usuario" [(ngModel)]="credenciales.usuario"
                    placeholder="admin@fluentsi.com" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" class="form-control" name="password" [(ngModel)]="credenciales.password"
                    placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary" [disabled]="cargando">
                {{ cargando ? 'Verificando...' : 'Iniciar Sesión' }}
            </button>
        </form>

    </div>
</div>

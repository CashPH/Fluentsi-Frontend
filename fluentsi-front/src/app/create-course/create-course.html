<div class="create-container">
    <nav class="navbar">
        <div class="nav-left">
            <img src="/logo.png" alt="Logo" class="logo">
            <ul class="nav-links">
                <li><a href="teacher-home">Inicio</a></li>
                <li><a href="agenda">Mi agenda</a></li>
                <li><a href="cursos" class="active">Cursos</a></li>
                <li><a href="revisiones">Revisiones</a></li>
                <li><a href="calificaciones-instructor">Calificaciones</a></li>

            </ul>
        </div>
        <img src="/monito.png" alt="Mascot" class="nav-mascot">
    </nav>

    <main class="main-content">
        <div class="form-card">
            <h2>+ Nuevo Curso</h2>

            <form [formGroup]="courseForm" (ngSubmit)="onSubmit()">

                <div class="form-group">
                    <label>Título del Curso</label>
                    <input type="text" formControlName="titulo" placeholder="Ej. Nouns Level 1">
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <textarea formControlName="descripcion" rows="4"
                        placeholder="De qué trata este curso..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Idioma (ID)</label>
                        <select formControlName="id_idioma">
                            <option [value]="1">1 - Inglés</option>
                            <option [value]="2">2 - Francés</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Nivel Recomendado</label>
                        <select formControlName="nivel_recomendado">
                            <option value="A1">A1</option>
                            <option value="A2">A2</option>
                            <option value="B1">B1</option>
                            <option value="B2">B2</option>
                            <option value="C1">C1</option>
                            <option value="C2">C2</option>
                        </select>
                    </div>
                </div>

                <div class="form-row align-center">
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="es_gratuito" formControlName="es_gratuito">
                        <label for="es_gratuito">Es Gratuito</label>
                    </div>

                    <div class="form-group" *ngIf="!courseForm.get('es_gratuito')?.value">
                        <label>Precio ($)</label>
                        <input type="number" formControlName="precio">
                    </div>
                </div>

                <button type="submit" class="submit-btn" [disabled]="courseForm.invalid">Guardar Curso</button>
            </form>
        </div>
    </main>
</div>

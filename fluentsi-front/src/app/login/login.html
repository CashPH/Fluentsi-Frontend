<div class="login-container">
<nav class="navbar">
    <div class="nav-left">
    <img src="/logo.png" alt="Fluent Si Logo" class="logo">
    <ul class="nav-links">
        <li><a href="#">Inicio</a></li>
    <li><a href="#">Cursos</a></li>
    </ul>
    </div>
    <button class="nav-login-btn">Log in</button>
</nav>

<main class="main-content">
    <div class="login-card">
    <div class="card-header">
        <h2>Inicia Sesión</h2>
    </div>
    
    <p class="subtitle">Ingresa tus datos para iniciar sesión</p>

    <img src="/monito.png" alt="Mascot" class="mascot">

    <div *ngIf="error" class="error-message">
        {{ error }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="input-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" formControlName="correo" placeholder="tu@correo.com"
            [class.error]="loginForm.get('correo')?.invalid && loginForm.get('correo')?.touched">
        <span *ngIf="loginForm.get('correo')?.invalid && loginForm.get('correo')?.touched" class="error-text">
            Ingresa un correo válido
        </span>
        </div>

        <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="Mínimo 6 caracteres"
            [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <span *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
            La contraseña es requerida
        </span>
        </div>

        <p class="register-text">¿No tienes cuenta? <a href="javascript:void(0)" (click)="goToRegister()">Regístrate aquí</a></p>

        <button type="submit" class="submit-btn" [disabled]="loading || loginForm.invalid">
            {{ loading ? 'Entrando...' : 'Entrar' }}
        </button>
    </form>
    </div>
</main>
</div>

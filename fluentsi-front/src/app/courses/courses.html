<div class="courses-container">
    <nav class="navbar">
        <div class="nav-left">
            <img src="logo.png" alt="Logo" class="logo">
              <ul class="nav-links">
               <li><a routerLink="/teacher-home">Inicio</a></li>
               <li><a routerLink="/agenda">Mi agenda</a></li>
               <li><a routerLink="/cursos" class="active">Cursos</a></li>
               <li><a routerLink="/revisiones">Revisiones</a></li>
                <li><a routerLink="/calificaciones-instructor">Calificaciones</a></li>
              </ul>
        </div>
        <div class="nav-right">
        <button class="logout-btn" (click)="logout()">Log out 🚪</button>
        <img src="monito.png" alt="Mascot" class="nav-mascot">
        </div>
    </nav>

    <main class="main-content">
        <div class="search-bar-container"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Busca un curso" [(ngModel)]="textoBusqueda">
            </div>

            <button *ngIf="!isStudent" routerLink="/crear-curso"
                style="padding: 0.8rem 1.5rem; background-color: #4ade80; color: #000; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 1rem;">
                + Nuevo Curso
            </button>
        </div>

        <div class="layout-grid">
            <aside class="sidebar">
                <div class="filter-group">
                    <h3>Nivel</h3>
                    <label *ngFor="let nivel of niveles">
                        <input type="checkbox" [checked]="nivelesSeleccionados.has(nivel)" (change)="toggleNivel(nivel)"> {{ nivel }}
                    </label>
                </div>

                <div class="filter-group">
                    <h3>Etiqueta</h3>
                    <label *ngFor="let etiqueta of etiquetas">
                        <input type="checkbox" [checked]="etiquetasSeleccionadas.has(etiqueta)" (change)="toggleEtiqueta(etiqueta)"> {{ etiqueta }}
                    </label>
                </div>
            </aside>

            <section class="courses-grid">
                <div class="course-card" *ngFor="let curso of cursosFiltrados" (click)="gestionarCurso(curso.id_curso)"
                    style="cursor: pointer;">
                    <div class="card-image-container">
                        <img src="assets/curso1.jpg" alt="Course Image" class="course-img">
                        <img src="logo-blanco.jpg" alt="Badge" class="card-badge">
                    </div>
                    <div class="card-body">
                        <span class="level-badge">{{ displayNivel(curso) }}</span>
                        <h4>{{ curso.titulo }}</h4>
                        <p class="course-author" style="font-size: 0.85rem; color: #64748b; margin: 0.3rem 0 0.5rem 0;">👨‍🏫 {{ curso.autor || 'Profesor' }}</p>
                        <div class="course-stats">
                            <span>📄 Lecciones</span>
                            <span>🕒 {{ curso.es_gratuito ? 'Gratis' : '$' + curso.precio }}</span>
                        </div>
                        <div style="display: flex; gap: 0.5rem; align-items: center; justify-content: space-between; margin-top: 0.5rem;" *ngIf="!isStudent">
                            <a class="start-link" style="margin: 0;">Gestionar ⚙️</a>
                            <button (click)="eliminarCurso(curso.id_curso, $event)" title="Borrar Curso" style="background: #ef4444; color: white; border: none; border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.85rem; cursor: pointer; font-weight: bold;">Borrar 🗑️</button>
                        </div>
                        <a class="start-link" *ngIf="isStudent && estaInscrito(curso.id_curso)">Acceder al contenido 📖</a>
                        <a class="start-link" *ngIf="isStudent && !estaInscrito(curso.id_curso)">Inscribirse 🚀</a>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
